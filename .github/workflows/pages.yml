name: Web demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Compile TypeScript
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/web _site/tegu_sim
          cp web/index.html _site/web/
          cp -r web/dist _site/web/dist
          cp tegu_sim/*.py _site/tegu_sim/
          cp everglades_tm5_1985306_lrg.jpg _site/
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=web/">' > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
